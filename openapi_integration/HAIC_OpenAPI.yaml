            - type: 'null'
          title: Inference Time Seconds
        deployment_details:
          anyOf:
            - type: string
            - type: 'null'
          title: Deployment Details
      type: object
      title: AIModelData
    AlertData:
      properties:
        alert_details:
          anyOf:
            - type: string
            - type: 'null'
          title: Alert Details
        alert_time:
          anyOf:
            - type: string
            - type: 'null'
          title: Alert Time
        load_setpoint:
          anyOf:
            - type: integer
            - type: 'null'
          title: Load Setpoint
        generation_setpoint:
          anyOf:
            - type: integer
            - type: 'null'
          title: Generation Setpoint
