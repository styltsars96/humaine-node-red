  /api/v1/log-generator/generate:
    get:
      tags:
        - Log Generator
      summary: Generate Log Endpoint
      description: |-
        Returns an array of *adapter-ready* session logs.
        Use /download to fetch a file if you need one.
      operationId: generate_log_endpoint_api_v1_log_generator_generate_get
      parameters:
        - name: app_type
          in: query
          required: false
          schema:
            type: string
            description: 'App type: hmi_xr | radiologist | <custom>'
            default: hmi_xr
            title: App Type
          description: 'App type: hmi_xr | radiologist | <custom>'
        - name: count
          in: query
          required: false
          schema:
            type: integer
            maximum: 1000
            minimum: 1
            description: Number of sessions to generate
            default: 3
            title: Count
          description: Number of sessions to generate
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            default: '2025-09-10T13:00:00Z'
            title: Start Date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            default: '2025-09-12T13:00:00Z'
            title: End Date
        - name: ai_model_version_range
          in: query
          required: false
          schema:
            type: string
            default: 1.0.0-2.0.0
            title: Ai Model Version Range
        - name: rt_max
          in: query
          required: false
          schema:
            type: number
            description: Max acceptable response time (s) for HCL
