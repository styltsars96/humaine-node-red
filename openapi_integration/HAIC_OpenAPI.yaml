          anyOf:
            - type: string
            - type: 'null'
          title: Predicted Security State
        confidence_bound:
          anyOf:
            - type: number
            - type: 'null'
          title: Confidence Bound
      type: object
      title: AlertData
    Body_upload_log_api_v1_logs_upload_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
        - file
      title: Body_upload_log_api_v1_logs_upload_post
    CollabMetricsResponse:
      properties:
        version:
          type: string
          title: Version
          default: 2.1.0
        metrics_version:
          type: string
          title: Metrics Version
          default: collab-0.2.0
        source:
          type: string
          title: Source
        params:
          additionalProperties:
            anyOf:
              - type: number
              - type: 'null'
          type: object
          title: Params
        metrics:
          $ref: '#/components/schemas/MetricsOut'
        by_agent:
          items:
            $ref: '#/components/schemas/PerAgentMetrics'
          type: array
          title: By Agent
          default: []
      type: object
      required:
        - source
        - params
        - metrics
      title: CollabMetricsResponse
    ComputeRequest:
      properties:
        decisions:
          items:
            $ref: '#/components/schemas/Decision'
          type: array
          title: Decisions
        rt_max:
          type: number
          exclusiveMinimum: 0
          title: Rt Max
          description: Upper cap for reaction-time scaling (sec) used by HCL
          default: 5
        baseline_s:
          anyOf:
            - type: number
              exclusiveMinimum: 0
            - type: 'null'
          title: Baseline S
          description: Baseline duration for EL (efficiency/latency)
      type: object
      required:
        - decisions
      title: ComputeRequest
    ConfigList:
      properties:
        available_configs:
          items:
            type: string
          type: array
          title: Available Configs
      type: object
      required:
        - available_configs
      title: ConfigList
    ConfigRequest:
      properties:
        task_name:
          type: string
          title: Task Name
          description: Scenario name
        task_description:
          anyOf:
            - type: string
            - type: 'null'
          title: Task Description
          description: Optional task description
        task_parameters:
          type: object
          title: Task Parameters
        agent_definitions:
          items:
            type: object
          type: array
          title: Agent Definitions
        profile_definitions:
          items:
            type: object
          type: array
          title: Profile Definitions
        filename:
          anyOf:
            - type: string
            - type: 'null'
          title: Filename
          description: >-
            Optional file name or path (absolute under project root,
            repo-relative, or bare). Defaults to
            haic_env_builder/configs/<task>_env.yaml.
      type: object
      required:
        - task_name
      title: ConfigRequest
    Decision:
      properties:
        t:
          type: number
          title: T
          description: 'Event timestamp (sec, monotonic within a session)'
        agent:
          anyOf:
            - type: string
            - type: 'null'
          title: Agent
          description: Agent/human identifier
        actor_type:
          anyOf:
            - type: string
            - type: 'null'
          title: Actor Type
          description: '''human'' | ''ai'' (used by HCL, per-agent stats)'
        action:
          anyOf:
            - type: string
            - type: 'null'
          title: Action
          description: Free-text action label
        duration_s:
          anyOf:
            - type: number
              minimum: 0
            - type: 'null'
          title: Duration S
          description: Action duration (sec)
        latency_ms:
          anyOf:
            - type: number
              minimum: 0
            - type: 'null'
          title: Latency Ms
          description: Alternative latency (ms) if duration_s missing
        correct:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Correct
          description: Outcome for Tr/A (True/False)
        probs:
          anyOf:
            - additionalProperties:
                type: number
              type: object
            - type: 'null'
          title: Probs
          description: Primary/human prob. distribution over classes
        surrogate_probs:
          anyOf:
            - additionalProperties:
                type: number
              type: object
            - type: 'null'
          title: Surrogate Probs
          description: Surrogate model prob. distribution
        surrogate_action:
          anyOf:
            - type: string
            - type: 'null'
          title: Surrogate Action
          description: Fallback if no probs; compare with action
        event_type:
          anyOf:
            - type: string
            - type: 'null'
          title: Event Type
          description: 'Optional: e.g., ''error'' marks an error event'
      type: object
      required:
        - t
      title: Decision
    EnvMeta:
      properties:
        id:
          type: string
          title: Id
