          description: Max acceptable response time (s) for HCL
        - name: baseline_s
          in: query
          required: false
          schema:
            type: number
            description: Baseline task time (s) for EL
            default: 0
            title: Baseline S
          description: Baseline task time (s) for EL
        - name: app_version
          in: query
          required: false
          schema:
            type: string
            default: 1.0.0
            title: App Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
