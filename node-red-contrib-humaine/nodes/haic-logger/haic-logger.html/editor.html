<script type="text/html" data-template-name="haic-logger">
  <div class="form-row" id="node-setup-message-haic-logger-options-error">
    <p style="color: red;"><!-- Any error message goes here --></p> 
  </div>
  <div class="form-row" id="node-setup-message-haic-logger-options-message">
    <p style="color: white;"><!-- Any instruction/prompt message goes here --></p> 
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <div style="width: 85%; display: inline-flex;">
      <label for="node-input-model"><i class="fa fa-cube"></i> Model / Agent </label>
      <select id="node-input-model" style="flex-grow: 1;"></select>
    </div>
  </div>
  <div class="form-row">
    <div style="width: 85%; display: inline-flex;">
      <label for="node-input-affordance_action"><i class="fa fa-bolt"></i> Action / Affordance </label>
      <select id="node-input-affordance_action" style="flex-grow: 1;"></select>
    </div>
  </div>
  <div class="form-row">
    <div style="width: 85%; display: inline-flex;">
      <label for="node-input-application"><i class="fa fa-bolt"></i> Application (Evaluation Config) </label>
      <select id="node-input-application" style="flex-grow: 1;"></select>
    </div>
  </div>
  <div class="form-row">
    <label for="node-input-sessionIdJsonPath"><i class="fa fa-id-card"></i> Session ID JSON Path</label>
    <input type="text" id="node-input-sessionIdJsonPath" placeholder="$payload.session_id">
  </div>
</script>
