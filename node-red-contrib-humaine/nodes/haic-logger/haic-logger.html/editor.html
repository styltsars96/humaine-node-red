<script type="text/html" data-template-name="haic-logger">
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-model"><i class="fa fa-cube"></i> Model</label>
    <input type="text" id="node-input-model" placeholder="Model name">
  </div>
  <div class="form-row">
    <label for="node-input-action"><i class="fa fa-bolt"></i> Action / Affordance</label>
    <input type="text" id="node-input-action" placeholder="Action or affordance name">
  </div>
  <div class="form-row">
    <label for="node-input-sessionIdJsonPath"><i class="fa fa-id-card"></i> Session ID JSON Path</label>
    <input type="text" id="node-input-sessionIdJsonPath" placeholder="$sessionId">
  </div>
  <div class="form-row">
    <label for="node-input-interactionIdJsonPath"><i class="fa fa-comment"></i> Interaction ID JSON Path (optional)</label>
    <input type="text" id="node-input-interactionIdJsonPath" placeholder="$interactionId">
  </div>
</script>
