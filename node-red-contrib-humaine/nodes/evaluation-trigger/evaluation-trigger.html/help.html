<script type="text/html" data-help-name="evaluation-trigger">
  <h3>Description</h3>
  <p>Triggers a configuration evaluation in the HAIC Benchmark Suite backend by calling <code>EvaluationService.evaluateConfigApiV1EvaluateConfigurationIdPost()</code>. This initiates an evaluation run for the specified configuration ID, which will be processed asynchronously by the backend.</p>

  <h3>Application Selection</h3>
  <p>The node resolves the configuration (application) to use in this order:</p>
  <ol type="A">
    <li><strong>Wired-in value</strong> — if a message arrives with <code>msg.payload.configId</code>, that takes priority.</li>
    <li><strong>Node's Application field</strong> — the value selected in the node's dropdown (see below).</li>
    <li><strong>Fallback to default</strong> — if both are empty, uses the <code>defaultApplication</code> set on the flow's <code>ai-environment-config</code>.</li>
  </ol>

  <h3>Prerequisites</h3>
  <ul>
    <li>An <code>ai-environment-config</code> node must be present and deployed in this flow.</li>
    <li>A valid <code>haic-config</code> config node must exist (referenced via the environment).</li>
    <li>The evaluation configuration ID you use must correspond to an existing configuration in the HAIC backend.</li>
  </ul>

  <h3>Usage Steps</h3>
  <ol>
    <li><strong>Add an <code>ai-environment-config</code> node</strong> to this flow and deploy it first.</li>
    <li><strong>Add a <code>haic-config</code> config node</strong> with your API credentials.</li>
    <li><strong>Add this <code>evaluation-trigger</code> node</strong> from the palette (HumAIne section).</li>
    <li><strong>Select an Application</strong> — choose which evaluation configuration to use. Populated dynamically from available configurations; "Use Default" selects the default set on <code>ai-environment-config</code>.</li>
    <li><strong>(Optional) Wire input</strong> — send a message with <code>msg.payload.configId</code> to override the node's Application field for that call. Deploy.</li>
  </ol>

  <h3>Configuration Fields</h3>
  <table>
    <tr><th style="text-align:left">Field</th><th style="text-align:left">Required</th><th style="text-align:left">Default</th><th style="text-align:left">Description</th></tr>
    <tr><td>Name</td><td>No</td><td><code>""</code></td><td>Display label in the editor canvas.</td></tr>
    <tr><td>Application (Evaluation Config)</td><td>No</td><td>From <code>ai-environment-config</code></td><td>Select which evaluation configuration to use. Populated dynamically from available configurations; "Use Default" selects the default set on <code>ai-environment-config</code>.</td></tr>
  </table>

  <h3>Input — msg.payload (optional override)</h3>
  <p>If a wired-in message provides <code>configId</code>, it overrides the node's Application field:</p>
  <pre style="background:var(--red-ui-secondary-background, #f5f5f5);padding:8px;border-radius:4px;font-size:12px;overflow-x:auto">msg.payload = {
    configId: 34           // number — optional override; falls back to node's Application field
};</pre>

  <h3>Backend API Call</h3>
  <pre style="background:var(--red-ui-secondary-background, #f5f5f5);padding:8px;border-radius:4px;font-size:12px;overflow-x:auto">POST /api/v1/evaluate/configuration/{configId}

Headers:
  Authorization: Bearer {token}   (or Basic auth from haic-config)
  Content-Type: application/json</pre>

  <h3>Output Message</h3>
  <p><code>msg.payload</code> is replaced by the evaluation result returned from the backend. All other <code>msg</code> properties are preserved and passed through.</p>

  <h3>Status Indicators</h3>
  <table>
    <tr><th style="text-align:left">Visual</th><th style="text-align:left">Duration</th><th style="text-align:left">Meaning</th></tr>
    <tr><td>Green dot — "Ready"</td><td>Persistent</td><td>Node is configured and waiting for input.</td></tr>
    <tr><td>Green ring — "Evaluation triggered"</td><td>2 seconds</td><td>The evaluation was successfully initiated by the backend.</td></tr>
    <tr><td>Red dot — "Error in evaluation-trigger node!"</td><td>3 seconds</td><td>An error occurred (missing configId, API failure). Check debug output.</td></tr>
    <tr><td>Red ring — "No AI Environment setup!"</td><td>Persistent</td><td>No <code>ai-environment-config</code> found in this flow. Add and deploy one first.</td></tr>
  </table>

  <h3>Editor Error Messages</h3>
  <p>These messages appear in the node's configuration panel:</p>
  <table>
    <tr><th style="text-align:left">Message</th><th style="text-align:left">When</th></tr>
    <tr><td><code>No AI Environment setup! Set an AI Environment config in the flow first.</code></td><td>No <code>ai-environment-config</code> found in flow context</td></tr>
  </table>

  <h3>Wiring Pattern</h3>
  <pre style="background:var(--red-ui-secondary-background, #f5f5f5);padding:8px;border-radius:4px;font-size:12px;overflow-x:auto">[inject / function] → [evaluation-trigger (optional payload.configId)]
    → [access-evaluation-results]</pre>

  <h3>Important Notes</h3>
  <ul>
    <li><strong>The evaluation runs asynchronously.</strong> The node returns immediately after triggering; use <code>access-evaluation-results</code> to poll for the result by configuration ID.</li>
    <li><strong>The OpenAPI client is fetched dynamically from flow context.</strong> If the environment changes between messages, a new lookup occurs each time — this adds minimal overhead but means your <code>haic-config</code> must be deployed before this node can resolve it.</li>
  </ul>
</script>
