<script type="text/html" data-help-name="ai-environment-config">
  <h3>Description</h3>
  <p>Selects and manages the AI workflow environment for a flow. Fetches agent/environment metadata from the HAIC backend and makes it available to other nodes (especially <code>haic-logger</code>) via flow context.</p>

  <h3>Usage Steps</h3>
  <ol>
    <li><strong>Add</strong> this config node to your flow (top panel → HumAIne)</li>
    <li><strong>Select a HAIC Server Config</strong> — pick an existing <code>haic-config</code> node. Deploy the flow first if needed.</li>
    <li><strong>Pick an AI Process Environment</strong> from the dropdown (populated live from the HAIC backend)</li>
    <li><strong>(Optional) Set a Default Application Config</strong> — this becomes the fallback for all logger nodes in this flow that don't specify one individually</li>
    <li><strong>Deploy</strong> — the node fetches environment metadata and stores it in flow context automatically</li>
  </ol>

  <h3>Configuration Fields</h3>
  <table>
    <tr><th style="text-align:left">Field</th><th style="text-align:left">Required</th><th style="text-align:left">Default</th><th style="text-align:left">Description</th></tr>
    <tr><td>Name</td><td>No</td><td><code>""</code></td><td>Display name shown in the editor</td></tr>
    <tr><td>HAIC Server Config</td><td>Yes</td><td>—</td><td>Reference to an <code>haic-config</code> config node. Required before other fields work.</td></tr>
    <tr><td>AI Process Environment</td><td>No</td><td>—</td><td>Select from environments fetched live via <code>GET /api/v1/envs</code>. Must be created in the HAIC backend first.</td></tr>
    <tr><td>Default Application Config</td><td>No (optional)</td><td><code>""</code></td><td>Fallback application for logger nodes. If empty, each logger must specify its own application.</td></tr>
  </table>

  <h3>Input / Output</h3>
  <p>This node has both input and output ports (1 in, 1 out).</p>
  
  <p><strong>On startup:</strong> Automatically fetches environment metadata and application configs. No message needed.</p>
  
  <p><strong>On receiving an input message:</strong> Refreshes all data from the HAIC backend and sends it through:</p>
  <pre style="background:#f5f5f5;padding:8px;border-radius:4px;font-size:12px;overflow-x:auto">msg.payload = {
    env: { sim_id, environment, agents, objects, script },
    blocks: { meta, blocks },
    appConfigsList: [...]  // application configurations
};</pre>

  <h3>Flow Context Keys Set by This Node</h3>
  <table>
    <tr><th style="text-align:left">Key</th><th style="text-align:left">Type</th><th style="text-align:left">Used By</th></tr>
    <tr><td><code>HumAIne_HAIC_ENVIRONMENT</code></td><td><code>{ haicApiNodeId, haicEnvironmentNodeId }</code></td><td><code>haic-logger</code>, runtime lookups</td></tr>
    <tr><td><code>HumAIne_AI_PROCESS_ENVIRONMENT</code></td><td><code>HumAIneEnvironmentData</code></td><td><code>haic-logger</code> model/action dropdowns, editor endpoints</td></tr>
    <tr><td><code>HumAIne_APP_CONFIGS</code></td><td><code>Record&lt;number, EvaluationConfigSchema&gt;</code></td><td><code>haic-logger</code> application dropdowns</td></tr>
  </table>

  <h3>Status Indicators</h3>
  <table>
    <tr><th style="text-align:left">State</th><th style="text-align:left">Visual</th><th style="text-align:left">Meaning</th></tr>
    <tr><td>Ready (idle)</td><td>Green dot + "AI Process Environment: {id}"</td><td>Environment data loaded, node is operational</td></tr>
    <tr><td>Just updated</td><td>Green dot + "JUST UPDATED"</td><td>Data refreshed via input trigger</td></tr>
    <tr><td>No HAIC server set</td><td>Red ring (in editor)</td><td>Select a <code>haic-config</code> first</td></tr>
    <tr><td>Duplicate config in flow</td><td>Red ring + "DUPLICATE CONFIG"</td><td>Only one ai-environment-config allowed per flow!</td></tr>
    <tr><td>No AI Environment ID selected</td><td>Green dot (in editor)</td><td>Pick an environment from the dropdown</td></tr>
    <tr><td>API fetch error</td><td>Red ring + error text</td><td>Failed to fetch data from HAIC backend</td></tr>
  </table>

  <h3>Important Notes</h3>
  <ul>
    <li><strong>Only one per flow.</strong> Adding a second will cause an error and refuse to start.</li>
    <li>The environment dropdown is populated from the HAIC API — environments must exist in the backend first.</li>
    <li>On node close, all flow context data is cleaned up (set to <code>undefined</code>).</li>
  </ul>

  <h3>Use Cases</h3>
  <ul>
    <li><strong>Flow initialization:</strong> Place at the start of a flow to establish which AI environment it operates against</li>
    <li><strong>Dynamic refresh:</strong> Wire an inject node (cron or manual trigger) into this node to refresh metadata without redeploying</li>
  </ul>
</script>
