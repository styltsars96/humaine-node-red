<script type="text/html" data-template-name="haic-config">
  <div class="form-row">
    <label for="node-input-name"><i class="icon-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-baseUrl"><i class="icon-globe"></i> Base URL</label>
    <input type="text" id="node-input-baseUrl" placeholder="https://example.com">
  </div>
  <div class="form-row">
    <label for="node-input-token"><i class="icon-key"></i> Token</label>
    <input type="password" id="node-input-token" placeholder="API Token">
  </div>
  <div class="form-row">
    <label for="node-input-username"><i class="icon-user"></i> Username</label>
    <input type="text" id="node-input-username" placeholder="Username">
  </div>
  <div class="form-row">
    <label for="node-input-password"><i class="icon-lock"></i> Password</label>
    <input type="password" id="node-input-password" placeholder="Password">
  </div>
  <div class="form-row">
    <label for="node-input-withCredentials"><i class="icon-cog"></i> With Credentials</label>
    <input type="checkbox" id="node-input-withCredentials" style="width: auto; margin-top: 5px;">
  </div>
  <div class="form-row">
    <label for="node-input-headers"><i class="fa fa-code"></i> Headers</label>
    <textarea id="node-input-headers" class="node-input-json-field" style="width: 100%; height: 200px; font-family: monospace;" placeholder="Headers as valid JSON here..."></textarea>
  </div>
</script>
